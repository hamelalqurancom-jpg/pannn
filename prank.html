<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SECURITY BREACH | تنبيه أمني</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #ff0000;
            --bg: #030303;
            --text: #ffffff;
            --secondary: #111;
            --neon-glow: 0 0 15px rgba(255, 0, 0, 0.8), 0 0 30px rgba(255, 0, 0, 0.4);
            --terminal-green: #00ff41;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Scanline Overlay */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.4) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.1), rgba(0, 255, 0, 0.05), rgba(0, 0, 255, 0.1));
            z-index: 1000;
            background-size: 100% 4px, 4px 100%;
            pointer-events: none;
            opacity: 0.3;
        }

        /* Vignette Effect */
        body::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 40%, black 150%);
            z-index: 1001;
            pointer-events: none;
        }

        .container {
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 700px;
            padding: 2.5rem;
            background: rgba(5, 5, 5, 0.95);
            border: 1px solid var(--primary);
            box-shadow: var(--neon-glow);
            border-radius: 4px;
            backdrop-filter: blur(8px);
            position: relative;
            animation: container-glitch 4s infinite;
        }

        @keyframes container-glitch {
            0% {
                transform: translate(0);
            }

            1% {
                transform: translate(-2px, 1px);
                border-color: #fff;
            }

            2% {
                transform: translate(2px, -1px);
                border-color: var(--primary);
            }

            3% {
                transform: translate(0);
            }
        }

        .icon {
            font-size: 6rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            filter: drop-shadow(var(--neon-glow));
            animation: pulse 0.5s infinite alternate;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: var(--neon-glow);
        }

        .warning-text {
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 2rem;
            color: #fff;
            background: var(--primary);
            display: inline-block;
            padding: 5px 15px;
            animation: blinker 0.2s steps(2) infinite;
        }

        @keyframes blinker {
            from {
                opacity: 1;
            }

            to {
                opacity: 0.4;
            }
        }

        .status {
            font-size: 1.2rem;
            margin-bottom: 1.5rem;
            color: #ff5555;
            font-weight: bold;
        }

        .progress-container {
            width: 100%;
            height: 25px;
            background: #0a0a0a;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 2rem;
            border: 1px solid #333;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: repeating-linear-gradient(45deg,
                    #ff0000,
                    #ff0000 10px,
                    #aa0000 10px,
                    #aa0000 20px);
            box-shadow: 0 0 20px #ff0000;
            transition: width 0.4s cubic-bezier(0.1, 0.7, 1.0, 0.1);
        }

        .terminal {
            background: #000;
            color: var(--terminal-green);
            font-family: 'Roboto Mono', monospace;
            text-align: left;
            padding: 1.5rem;
            height: 200px;
            overflow-y: hidden;
            border: 1px solid #222;
            font-size: 0.9rem;
            direction: ltr;
            border-radius: 3px;
            box-shadow: inset 0 0 10px #000;
        }

        .log-entry {
            margin-bottom: 6px;
            display: block;
            text-shadow: 0 0 5px var(--terminal-green);
        }

        .overlay-red {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.15);
            pointer-events: none;
            z-index: 2000;
            animation: flicker 0.1s infinite;
            display: none;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                filter: brightness(1);
            }

            100% {
                transform: scale(1.1);
                filter: brightness(1.5);
            }
        }

        @keyframes flicker {
            0% {
                opacity: 0;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                opacity: 0;
            }
        }

        .btn-start {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 1.2rem 3rem;
            font-size: 1.5rem;
            font-weight: 900;
            border-radius: 0;
            cursor: pointer;
            margin-top: 2rem;
            font-family: 'Cairo', sans-serif;
            text-transform: uppercase;
            transition: 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn-start:hover {
            background: var(--primary);
            color: white;
            box-shadow: 0 0 30px var(--primary);
        }

        .hidden {
            display: none;
        }

        .shake {
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }

            10% {
                transform: translate(-1px, -2px) rotate(-1deg);
            }

            20% {
                transform: translate(-3px, 0px) rotate(1deg);
            }

            30% {
                transform: translate(3px, 2px) rotate(0deg);
            }

            40% {
                transform: translate(1px, -1px) rotate(1deg);
            }

            50% {
                transform: translate(-1px, 2px) rotate(-1deg);
            }

            60% {
                transform: translate(-3px, 1px) rotate(0deg);
            }

            70% {
                transform: translate(3px, 1px) rotate(-1deg);
            }

            80% {
                transform: translate(-1px, -1px) rotate(1deg);
            }

            90% {
                transform: translate(1px, 2px) rotate(0deg);
            }

            100% {
                transform: translate(1px, -2px) rotate(-1deg);
            }
        }
    </style>
</head>

<body>

    <div class="overlay-red" id="overlay"></div>

    <!-- Pre-prank screen -->
    <div id="start-screen" class="container">
        <div class="icon">⚠️</div>
        <h1>تنبيه حماية النظام</h1>
        <p style="margin-bottom: 1.5rem;">تم اكتشاف محاولة وصول غير مصرح بها. يرجى التحقق من حالة الهاتف فوراً.</p>
        <button class="btn-start" onclick="startPrank()">فحص النظام الآن</button>
    </div>

    <!-- Main Prank Container -->
    <div id="prank-container" class="container hidden">
        <div class="icon">☣️</div>
        <h1 id="main-title">CRITICAL SYSTEM FAILURE</h1>
        <div class="warning-text">تم تجميد النظام: جاري استخراج البيانات الحساسة</div>
        <div class="status" id="status-msg">Initiating Deep-Link Protocol...</div>

        <div class="progress-container">
            <div class="progress-bar" id="bar"></div>
        </div>

        <div class="terminal" id="terminal">
            <span class="log-entry">> Initializing Zero-Day Exploit...</span>
            <span class="log-entry">> Target OS: Mobile/Web-Client Identified...</span>
        </div>
    </div>

    <script>
        const logs = [
            "Attempting SSH injection: [SUCCESS]",
            "Escalating privileges to ROOT...",
            "Decrypting WhatsApp database (SQLite)...",
            "Bypassing FaceID/Pattern lock security...",
            "Accessing Private Cloud Storage...",
            "Cloning personal photos to remote mirror...",
            "Intercepting incoming SMS messages...",
            "Extracting Banking/OTP history...",
            "Installing Remote Access Trojan (RAT)...",
            "Encrypting local storage with RSA-4096...",
            "Deleting system backup partitions...",
            "Sending data to C&C Server: 103.45.21.9",
            "Wiping authentication logs...",
            "FATAL ERROR: SYSTEM CONTROL LOST"
        ];

        let logIndex = 0;
        let progress = 0;

        function startPrank() {
            // Attempt Fullscreen
            try {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                }
            } catch (e) { }

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('prank-container').classList.remove('hidden');
            document.getElementById('overlay').style.display = 'block';

            // Vibration
            if (navigator.vibrate) {
                navigator.vibrate([500, 200, 500, 200, 1000]);
            }

            updatePrank();
        }

        function updatePrank() {
            const bar = document.getElementById('bar');
            const statusMsg = document.getElementById('status-msg');
            const terminal = document.getElementById('terminal');

            const interval = setInterval(() => {
                progress += Math.random() * 2;
                if (progress > 100) progress = 100;

                bar.style.width = progress.toFixed(1) + '%';

                if (progress < 25) statusMsg.innerText = "جاري كسر شفرة الحماية الرئيسية...";
                else if (progress < 50) statusMsg.innerText = "تم الوصول لملفات الصور والمحادثات الشخصية...";
                else if (progress < 75) statusMsg.innerText = "جاري تشفير كافة البيانات ومنع الوصول إليها...";
                else if (progress < 95) statusMsg.innerText = "جاري رفع الملفات للسيرفر المجهول (4.8GB)...";
                else statusMsg.innerText = "اكتملت العملية: جاري قفل النظام بالكامل...";

                if (Math.random() > 0.6 && logIndex < logs.length) {
                    const entry = document.createElement('span');
                    entry.className = 'log-entry';
                    entry.innerText = '> ' + logs[logIndex];
                    terminal.appendChild(entry);
                    terminal.scrollTop = terminal.scrollHeight;
                    logIndex++;
                }

                if (progress >= 100) {
                    clearInterval(interval);
                    document.body.classList.add('shake');
                    document.getElementById('main-title').innerText = "تم اختراقك بنجاح";
                    statusMsg.innerText = "تم تشفير كافة ملفاتك. سيتم حذفها تلقائياً بعد 24 ساعة.";
                    document.getElementById('overlay').style.animation = 'flicker 0.05s infinite';
                    document.getElementById('overlay').style.background = 'rgba(255, 0, 0, 0.6)';

                    setTimeout(() => {
                        document.body.innerHTML = `
                            <div class="container" style="border-color: #fff; background: #000; animation: none;">
                                <div class="icon" style="color: #fff;">☠️</div>
                                <h1 style="color: #fff; font-size: 3rem;">SYSTEM LOCKED</h1>
                                <p style="color: #f00; font-size: 1.5rem; font-weight: bold; margin: 20px 0;">تم فقدان السيطرة على الجهاز</p>
                                <p style="color: #aaa; direction: rtl;">لا تحاول إغلاق الصفحة أو إعادة تشغيل الجهاز، سيؤدي ذلك إلى حذف البيانات فوراً.</p>
                                <div style="margin-top: 30px; font-family: monospace; color: #555;">ERROR_CODE: 0x8004100E_CRITICAL_FAILURE</div>
                            </div>
                        `;
                        document.body.style.background = "#000";
                    }, 2000);
                }
            }, 150);
        }
    </script>
</body>

</html>
